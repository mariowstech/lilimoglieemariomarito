<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Viewport ottimizzato per app mobile-first, impedisce lo zoom accidentale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ciao amoremio 💗</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configurazione Tailwind per supportare i colori custom e la Dark Mode di sistema -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mariow: {
                            light: '#e0f2f1', // Verde acqua chiarissimo
                            dark: '#00251a',  // Verde foresta scurissimo
                            accent: '#00bfa5', // Accento Material 
                            glass: 'rgba(255, 255, 255, 0.25)',
                            glassDark: 'rgba(0, 0, 0, 0.35)'
                        }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <style>
        :root {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Evita lo scroll elastico fuori pagina su iOS */
            overscroll-behavior-y: none;
        }

        /* Glassmorphism di altissima qualità in stile macOS/mariowOS */
        .glass-panel {
            background: var(--tw-mariow-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            .glass-panel {
                background: var(--tw-mariow-glassDark);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            }
        }

        /* Animazioni di transizione fluide (Bouncy effect) */
        .bouncy-tap:active {
            transform: scale(0.95);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .bouncy-tap {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Gestione fluida dell'animazione del cerchio */
        #breathing-circle {
            transition: transform ease-in-out;
        }
        
        #breathe-text {
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="bg-mariow-light dark:bg-mariow-dark text-slate-800 dark:text-slate-100 min-h-[100dvh] flex flex-col relative overflow-hidden transition-colors duration-700">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-teal-300/40 dark:bg-teal-900/40 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-emerald-300/40 dark:bg-emerald-900/40 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-green-200/40 dark:bg-green-900/40 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <main class="flex-1 flex flex-col px-6 py-8 md:px-12 md:max-w-md mx-auto w-full h-full z-10 relative">
        
        <!-- Header -->
        <header class="text-center mb-8 mt-4">
            <h1 class="text-3xl font-bold tracking-tight mb-2">ciao amoremio 💗</h1>
            <p class="text-sm opacity-70 font-medium">respira pianopianino, sono qui con te.</p>
        </header>

        <section class="mb-10 w-full">
            <audio id="bg-music" loop>
                <source src="files/thoughts_in_my_mind.mp3" type="audio/mpeg">
            </audio>
            
            <button id="play-btn" class="glass-panel w-full rounded-[2rem] p-4 flex items-center justify-between bouncy-tap group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-mariow-accent/20 dark:bg-mariow-accent/40 text-mariow-accent dark:text-emerald-300 flex items-center justify-center transition-colors">
                        <span id="play-icon" class="material-symbols-rounded text-3xl">play_arrow</span>
                    </div>
                    <div class="text-left">
                        <p class="text-xs font-bold uppercase tracking-wider opacity-60 mb-1">musichetta</p>
                        <p class="text-sm font-semibold truncate max-w-[150px] xs:max-w-[200px]">Baby I Love You</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full border border-current opacity-30 flex items-center justify-center group-hover:opacity-100 transition-opacity">
                    <span class="material-symbols-rounded text-lg">music_note</span>
                </div>
            </button>
        </section>

        <section class="flex-1 flex flex-col items-center justify-center mb-10 relative">
            <div class="relative w-64 h-64 flex items-center justify-center">
                <!-- Anello di sfondo fisso -->
                <div class="absolute w-full h-full rounded-full border-[3px] border-mariow-accent/20 dark:border-white/10"></div>
                
                <!-- Cerchio animato -->
                <div id="breathing-circle" class="absolute w-32 h-32 rounded-full bg-gradient-to-br from-emerald-300 to-teal-400 dark:from-emerald-600 dark:to-teal-800 shadow-[0_0_50px_rgba(52,211,153,0.4)] opacity-90"></div>
                
                <!-- Testo di fase -->
                <h2 id="breathe-text" class="absolute text-2xl font-bold text-slate-800 dark:text-white drop-shadow-md z-10 pointer-events-none text-center leading-tight">
                    Pronta?
                </h2>
            </div>
            <!-- Indicatore tempi -->
            <p class="text-xs opacity-50 mt-12 font-medium tracking-widest uppercase">4s Inspira • 4s Trattieni • 6s Espira</p>
        </section>

        <section class="mb-6">
            <div class="glass-panel rounded-[2rem] p-5 flex flex-col items-center text-center">
                <p id="message-display" class="text-sm md:text-base font-medium min-h-[3rem] flex items-center justify-center italic opacity-90 mb-4 transition-opacity duration-300">
                    "tocca il cuoricino per sentirmi vicino a te."
                </p>
                <button onclick="generateMessage()" class="bouncy-tap w-12 h-12 rounded-full bg-white/50 dark:bg-white/10 shadow-sm flex items-center justify-center text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-colors">
                    <span class="material-symbols-rounded text-2xl fill-current">favorite</span>
                </button>
            </div>
        </section>

        <section class="mt-auto">
            <!-- SOSTITUISCI GLI ZERI CON IL TUO NUMERO DI TELEFONO VERO -->
            <a href="tel:0000000000" class="bouncy-tap w-full bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-500 dark:hover:bg-emerald-600 text-white rounded-3xl p-4 flex items-center justify-center gap-3 shadow-lg shadow-emerald-600/30 transition-all font-semibold text-lg">
                <span class="material-symbols-rounded">call</span>
                <span>chiamami</span>
            </a>
        </section>
    </main>

    <script>
        // --- LOGICA PLAYER AUDIO ---
        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.textContent = 'play_arrow';
            } else {
                audio.play().catch(error => {
                    console.log("Riproduzione automatica bloccata dal browser, interazione richiesta.", error);
                });
                playIcon.textContent = 'pause';
            }
            isPlaying = !isPlaying;
        });

        // --- LOGICA RESPIRAZIONE (Ciclo 14s: 4 in, 4 hold, 6 out) ---
        const circle = document.getElementById('breathing-circle');
        const text = document.getElementById('breathe-text');
        
        function updateBreatheText(newText) {
            text.style.opacity = 0;
            setTimeout(() => {
                text.innerText = newText;
                text.style.opacity = 1;
            }, 500); // Mezzo secondo per il fade out
        }

        function breathingCycle() {
            // Fase 1: INSPIRA (4 secondi)
            updateBreatheText("Inspira...");
            circle.style.transitionDuration = '4s';
            circle.style.transform = 'scale(2.2)'; // Espande il cerchio
            
            setTimeout(() => {
                // Fase 2: TRATTENI (4 secondi)
                updateBreatheText("Trattieni...");
                // Nessuna modifica al transform, rimane ingrandito
                
                setTimeout(() => {
                    // Fase 3: ESPIRA (6 secondi)
                    updateBreatheText("Espira...");
                    circle.style.transitionDuration = '6s';
                    circle.style.transform = 'scale(1)'; // Ritorna normale
                    
                }, 4000); // Aspetta i 4s di trattenuta
                
            }, 4000); // Aspetta i 4s di inspirazione
        }

        // Avvio respirazione al caricamento
        setTimeout(() => {
            breathingCycle();
            // Ripete il ciclo ogni 14 secondi totali
            setInterval(breathingCycle, 14000);
        }, 1000); // Piccolo ritardo iniziale per farle leggere "Pronta?"


        // --- LOGICA MESSAGGI DOLCI ---
        const messages = [
            "respira piano, il tuo marietto è qui con te.",
            "tutto andrà bene amore, te lo prometto.",
            "ti amo amoremio, sei la cosa più bella della mia vita.",
            "sei al sicuro, ci penso io a te.",
            "sono qui, non ti lascio sola amoremio.",
            "chiudi gli occhi e pensami.",
            "passerà presto amore, lascialo scorrere, io ti tengo la manina.",
            "sei la mia persona preferita in tutto l'universo.",
            "ogni volta che respiri, immagina il mio vicino al tuo."
        ];

        const messageDisplay = document.getElementById('message-display');

        function generateMessage() {
            messageDisplay.style.opacity = 0; // Fade out
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * messages.length);
                messageDisplay.innerText = `"${messages[randomIndex]}"`;
                messageDisplay.style.opacity = 1; // Fade in
            }, 300); // Sincronizzato con la durata della transizione CSS
        }
    </script>
</body>
</html>
